<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanzi Drill</title>
<meta name="description" content="Practice your 1,000 Chinese characters: study origins, read, recall and write.">
<meta name="theme-color" content="#2C6B57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hanzi Drill">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one narrow phone-first column; a squared practice sheet (田字格) is the hero of every card */
:root{
  --paper:#F2F4F1; --sheet:#FFFFFF; --ink:#18201D; --muted:#5E6A65; --line:#D9DFDB;
  --grid:#E4B9B3; --jade:#2C6B57; --jade-soft:#DDEBE5; --seal:#B23A2F; --seal-soft:#F6E1DE;
  --ochre:#8A6417; --ochre-soft:#F3E8CF;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --han:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","SimSun","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121614; --sheet:#1A201D; --ink:#E6EAE7; --muted:#97A39E; --line:#2C3531;
  --grid:#5A3430; --jade:#6DB59B; --jade-soft:#1E3129; --seal:#E26C60; --seal-soft:#3A1F1C;
  --ochre:#D9AE5B; --ochre-soft:#33291A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121614; --sheet:#1A201D; --ink:#E6EAE7; --muted:#97A39E; --line:#2C3531;
  --grid:#5A3430; --jade:#6DB59B; --jade-soft:#1E3129; --seal:#E26C60; --seal-soft:#3A1F1C;
  --ochre:#D9AE5B; --ochre-soft:#33291A; color-scheme:dark}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:none;flex-direction:column;gap:16px}
.wrap[data-view="setup"] #setup,.wrap[data-view="quiz"] #quiz,.wrap[data-view="results"] #results,.wrap[data-view="study"] #study{display:flex}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
h1 .han{font-family:var(--han);font-size:26px;color:var(--seal)}
.sub{color:var(--muted);font-size:14px;margin:0}
.status{font-size:13px;color:var(--jade);margin:4px 0 0;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.field span{font-size:13px;color:var(--muted)}
input[type=number]{font:600 18px var(--ui);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
input:focus-visible,button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 14px var(--ui);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer}
.chip:active{transform:scale(.97)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg.len{grid-template-columns:repeat(4,1fr)}
.seg button{font:600 15px var(--ui);border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-weight:400;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggle{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--jade)}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}
.count b{color:var(--ink)}
.btn{font:600 17px var(--ui);border:0;border-radius:var(--r);padding:15px 18px;cursor:pointer;background:var(--jade);color:var(--sheet);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.99)}
.err{color:var(--seal);font-size:14px;margin:0}

/* quiz + study */
.bar{display:flex;align-items:center;gap:12px}
.bar .x{border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;padding:4px 6px;cursor:pointer}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--jade);width:0;transition:width .25s}
.tally{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.box{position:relative;width:min(62vw,230px);aspect-ratio:1;max-width:100%;background:var(--sheet);border:2px solid var(--seal);border-radius:4px}
.box.big{width:min(86vw,300px)}
.box svg.g{position:absolute;inset:0;width:100%;height:100%}
.box svg.g line{stroke:var(--grid);stroke-width:1;stroke-dasharray:4 4}
.box .glyph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--han);font-weight:500;font-size:min(44vw,165px);line-height:1;color:var(--ink)}
.box .writer{position:absolute;inset:0;touch-action:none}
.meaning{font-size:24px;font-weight:600;max-width:30ch;text-wrap:balance;margin:0}
.py{font-size:20px;color:var(--jade);font-weight:600;margin:0}
.meta{font-size:13px;color:var(--muted);margin:0}
.pill{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px var(--ui);cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:var(--r);padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;text-align:center;font-family:var(--ui)}
.opt .k{position:absolute;top:6px;left:8px;font-size:11px;color:var(--muted)}
.opt .o-py{font-size:18px;font-weight:600;color:var(--jade)}
.opt .o-mn{font-size:15px;line-height:1.3}
.opt .o-han{font-family:var(--han);font-size:44px;line-height:1.1}
.opt.right{border-color:var(--jade);background:var(--jade-soft)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.feedback{min-height:24px;text-align:center;font-size:15px;font-weight:600;margin:0}
.feedback.good{color:var(--jade)} .feedback.bad{color:var(--seal)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tools button{font:500 14px var(--ui);border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 6px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--ochre);background:var(--ochre-soft)}

/* origin card */
.origin{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.o-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.badge.p{background:var(--jade-soft);color:var(--jade)}
.badge.i{background:var(--ochre-soft);color:var(--ochre)}
.badge.s{background:var(--seal-soft);color:var(--seal)}
.badge.n{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.trad{font-size:13px;color:var(--muted)}
.trad b{font-family:var(--han);font-size:20px;font-weight:500;color:var(--ink);margin-left:4px}
.o-text{margin:0;font-size:15.5px;line-height:1.5}
.o-text .h{font-family:var(--han);font-size:1.15em}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.part{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 8px;background:var(--paper);min-width:0}
.part .pc{font-family:var(--han);font-size:28px;line-height:1}
.part .pd{display:flex;flex-direction:column;font-size:13px;line-height:1.25;min-width:0}
.part .pd b{color:var(--jade);font-weight:600}
.part .tag{font-size:11px;color:var(--seal);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.o-rad{margin:0;font-size:13px;color:var(--muted)}
.o-rad .h{font-family:var(--han);font-size:17px;color:var(--ink)}

/* study */
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* results */
.score{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin:0}
.score small{font-size:20px;color:var(--muted);font-weight:500}
.miss{display:flex;flex-direction:column}
.miss button{display:grid;grid-template-columns:44px 56px 1fr;gap:10px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.miss button:first-child{border-top:0}
.miss .h{font-family:var(--han);font-size:30px}
.miss .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.miss .t{min-width:0}
.miss .t b{color:var(--jade);font-weight:600;margin-right:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app" data-view="setup">
  <!-- SETUP -->
  <section class="view" id="setup">
    <header>
      <h1><span class="han">汉字</span>Hanzi Drill</h1>
      <p class="sub">Practice the characters from your 1,000-character list.</p>
      <p class="status" id="offline" hidden>Available offline</p>
    </header>

    <div class="panel">
      <p class="label">Which characters</p>
      <div class="row">
        <label class="field"><span>From day</span><input id="from" type="number" inputmode="numeric" min="1" max="1000"></label>
        <label class="field"><span>To day</span><input id="to" type="number" inputmode="numeric" min="1" max="1000"></label>
      </div>
      <div class="chips" id="presets">
        <button class="chip" data-p="all">All I've learned</button>
        <button class="chip" data-p="1">Today's</button>
        <button class="chip" data-p="7">Last 7</button>
        <button class="chip" data-p="30">Last 30</button>
        <button class="chip" data-p="100">Last 100</button>
      </div>
      <div class="row" style="justify-content:space-between">
        <label class="field" style="max-width:170px"><span>I've learned up to day</span><input id="learned" type="number" inputmode="numeric" min="1" max="1000"></label>
        <p class="count" id="count"></p>
      </div>
    </div>

    <div class="panel">
      <p class="label">Mode</p>
      <div class="seg" id="mode">
        <button data-v="study" aria-pressed="false">Study<small>origins &amp; strokes</small></button>
        <button data-v="read" aria-pressed="true">Read<small>字 → meaning</small></button>
        <button data-v="recall" aria-pressed="false">Recall<small>meaning → 字</small></button>
        <button data-v="write" aria-pressed="false">Write<small>draw it</small></button>
      </div>
      <div id="quizOpts" style="display:flex;flex-direction:column;gap:12px">
        <p class="label" style="margin:4px 0 0">Questions</p>
        <div class="seg len" id="len">
          <button data-v="10" aria-pressed="false">10</button>
          <button data-v="20" aria-pressed="true">20</button>
          <button data-v="50" aria-pressed="false">50</button>
          <button data-v="0" aria-pressed="false">All</button>
        </div>
        <label class="toggle"><input type="checkbox" id="focus" checked> Show the ones I miss more often</label>
      </div>
    </div>

    <button class="btn" id="start">Start</button>
    <p class="err" id="err" hidden></p>
    <p class="sub" id="weakLine" hidden></p>
  </section>

  <!-- QUIZ -->
  <section class="view" id="quiz">
    <div class="bar">
      <button class="x" id="quit" aria-label="End practice">×</button>
      <div class="prog"><i id="progBar"></i></div>
      <span class="tally" id="tally"></span>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="opts" id="opts"></div>
    <div class="tools" id="wtools" hidden>
      <button id="wParts" aria-pressed="false">Parts hint</button>
      <button id="wHint" aria-pressed="false">Show outline</button>
      <button id="wShow">Show me</button>
      <button id="wRedo">Start over</button>
    </div>
    <div id="wpartsBox"></div>
    <p class="feedback" id="fb"></p>
    <div id="after"></div>
    <button class="btn" id="next" hidden>Next</button>
  </section>

  <!-- STUDY -->
  <section class="view" id="study">
    <div class="bar">
      <button class="x" id="sQuit" aria-label="Close study">×</button>
      <div class="prog"><i id="sBar"></i></div>
      <span class="tally" id="sTally"></span>
    </div>
    <div class="prompt" id="sCard"></div>
    <div class="nav">
      <button class="btn ghost" id="sPrev">Previous</button>
      <button class="btn" id="sNext">Next</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="view" id="results">
    <div class="panel" style="align-items:center;text-align:center">
      <p class="label" style="margin:0">Your score</p>
      <p class="score" id="score"></p>
      <p class="sub" id="scoreNote"></p>
    </div>
    <div class="panel" id="missPanel">
      <p class="label" style="margin:0">To review · tap one to study it</p>
      <div class="miss" id="missList"></div>
    </div>
    <button class="btn" id="studyMissed">Study the missed ones</button>
    <button class="btn ghost" id="again">Quiz the missed ones again</button>
    <button class="btn ghost" id="home">Back to setup</button>
  </section>
</div>

<script src="data.js"></script>
<script src="hanzi-writer.min.js"></script>
<script>
const WORDS = window.HANZI; // [char, pinyin, meaning, origin] in day order
const N = WORDS.length;
const $ = id => document.getElementById(id);
const app = $('app');
const GRID = '<svg class="g" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- saved settings ---------- */
const KEY = 'hanzi-drill-v1';
const startDay = Math.max(1, Math.min(N, Math.floor((Date.now() - new Date(2026, 9, 2)) / 864e5) + 1));
let S = {learned: startDay, from: 1, to: startDay, mode: 'read', len: 20, focus: true, miss: {}, hit: {}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const clamp = v => Math.max(1, Math.min(N, Math.round(+v || 1)));
function show(v){ app.dataset.view = v; window.scrollTo(0, 0); }

/* ---------- origin card ---------- */
const BADGE = {p: 'Picture', i: 'Combined idea', s: 'Meaning + sound', n: 'Origin note'};
const bare = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ü/g,'v').toLowerCase();
function hanSpan(text){ return esc(text).replace(/([⺀-⿟㐀-鿿豈-﫿])/g, '<span class="h">$1</span>'); }
function originHTML(day, opts = {}){
  const [c, py, , o] = WORDS[day-1];
  if (!o) return '';
  let text = '';
  if (o.t === 's'){
    const bits = [];
    if (o.sm) bits.push(`${o.sm[0]} (${o.sm[1]}) hints at the meaning`);
    if (o.ph){
      const same = o.ph[1] && bare(o.ph[1]) === bare(py);
      bits.push(`${o.ph[0]}${o.ph[1] ? ' ' + o.ph[1] : ''} gives the sound${o.ph[1] ? (same ? ' (same syllable)' : ' (a close sound, at least historically)') : ''}`);
    }
    text = bits.join('; ') + '.';
  } else text = o.h || '';
  const parts = (o.pa || []).map(p => {
    const isRad = o.r && p[0] === o.r[0];
    return `<span class="part"><span class="pc">${p[0]}</span><span class="pd">${p[1] ? `<b>${esc(p[1])}</b>` : ''}<span>${esc(p[2] || '')}</span>${isRad ? '<span class="tag">Radical</span>' : ''}</span></span>`;
  }).join('');
  const radInParts = o.r && (o.pa || []).some(p => p[0] === o.r[0]);
  const rad = o.r && !radInParts ? `<p class="o-rad">Radical <span class="h">${o.r[0]}</span> · ${esc(o.r[1] || '')}</p>` : '';
  if (opts.partsOnly){
    return `<div class="origin"><div class="o-head"><span class="label" style="margin:0">Parts</span></div>${parts ? `<div class="parts">${parts}</div>` : '<p class="o-text">This one is a single picture with no smaller parts.</p>'}${rad}</div>`;
  }
  return `<div class="origin">
    <div class="o-head"><span class="badge ${o.t}">${BADGE[o.t]}</span>${o.tr ? `<span class="trad">Traditional<b>${esc(o.tr)}</b></span>` : ''}</div>
    ${text ? `<p class="o-text">${hanSpan(text)}</p>` : ''}
    ${parts ? `<div class="parts">${parts}</div>` : ''}${rad}
  </div>`;
}

/* ---------- setup screen ---------- */
function paintSetup(){
  $('from').value = S.from; $('to').value = S.to; $('learned').value = S.learned;
  $('focus').checked = S.focus;
  paintControls();
}
function paintControls(){
  for (const b of $('mode').children) b.setAttribute('aria-pressed', b.dataset.v === S.mode);
  for (const b of $('len').children) b.setAttribute('aria-pressed', +b.dataset.v === S.len);
  $('quizOpts').style.display = S.mode === 'study' ? 'none' : 'flex';
  $('start').textContent = S.mode === 'study' ? 'Start studying' : 'Start';
  $('err').hidden = true;
  updateCount();
  const weak = Object.entries(S.miss).filter(([c,m]) => m - (S.hit[c]||0)*0.5 > 0).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  $('weakLine').hidden = !weak.length;
  if (weak.length) $('weakLine').textContent = 'Most missed so far: ' + weak.join(' ');
}
function readRange(){ let a = clamp($('from').value), b = clamp($('to').value); return a <= b ? [a, b] : [b, a]; }
function updateCount(){
  const [a,b] = readRange(), n = b - a + 1;
  $('count').innerHTML = `<b>${n}</b> character${n>1?'s':''} · ${WORDS[a-1][0]} to ${WORDS[b-1][0]}`;
}
['from','to'].forEach(id => $(id).addEventListener('input', updateCount));
$('learned').addEventListener('change', () => { S.learned = clamp($('learned').value); $('learned').value = S.learned; save(); });
$('presets').addEventListener('click', e => {
  const p = e.target.dataset.p; if (!p) return;
  S.learned = clamp($('learned').value); save();
  const end = S.learned, start = p === 'all' ? 1 : Math.max(1, end - +p + 1);
  $('from').value = start; $('to').value = end; updateCount();
});
for (const id of ['mode','len']) $(id).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (id === 'mode') S.mode = b.dataset.v; else S.len = +b.dataset.v;
  save(); paintControls();
});
$('start').addEventListener('click', () => {
  const [a,b] = readRange();
  S.from = a; S.to = b; S.focus = $('focus').checked; save();
  const days = []; for (let d=a; d<=b; d++) days.push(d);
  if (S.mode === 'study') startStudy(days); else startQuiz(null);
});

/* ---------- question building ---------- */
function weight(c){ return S.focus ? Math.max(0.5, 1 + 2*(S.miss[c]||0) - 0.7*(S.hit[c]||0)) : 1; }
function pickQuestions(days, n){
  const pool = days.slice(), out = [];
  if (!n || n >= pool.length) return shuffle(pool);
  while (out.length < n){
    const w = pool.map(d => weight(WORDS[d-1][0]));
    let t = Math.random() * w.reduce((x,y)=>x+y,0), i = 0;
    while ((t -= w[i]) > 0 && i < pool.length-1) i++;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function words(m){ return new Set(m.toLowerCase().replace(/\(.*?\)/g,'').split(/[;,]/).map(s=>s.trim()).filter(Boolean)); }
function clash(a, b){ const A = words(WORDS[a-1][2]); for (const w of words(WORDS[b-1][2])) if (A.has(w)) return true; return WORDS[a-1][1] === WORDS[b-1][1]; }
function distractors(day, [lo, hi]){
  const cands = [];
  for (let d = lo; d <= hi; d++) if (d !== day) cands.push(d);
  for (let r = 1; cands.length < 12 && r < N; r++){ if (lo - r >= 1) cands.push(lo - r); if (hi + r <= N) cands.push(hi + r); }
  shuffle(cands);
  const out = [];
  for (const d of cands){
    if (out.length === 3) break;
    if (!clash(day, d) && !out.some(o => clash(o, d))) out.push(d);
  }
  return out;
}

/* ---------- quiz ---------- */
let Q = null, answered = false, autoT = null, writer = null, wState = null;
function startQuiz(list){
  const [a,b] = readRange(), all = [];
  for (let d=a; d<=b; d++) all.push(d);
  if (S.mode === 'write' && typeof HanziWriter === 'undefined'){
    $('err').textContent = 'Writing practice could not load. Reload the page while online once.'; $('err').hidden = false; return;
  }
  Q = {list: list || pickQuestions(all, S.len), i: 0, right: 0, missed: [], range: [a,b], mode: S.mode};
  show('quiz'); ask();
}
function hud(){
  $('progBar').style.width = (Q.i / Q.list.length * 100) + '%';
  $('tally').textContent = `${Math.min(Q.i+1, Q.list.length)} / ${Q.list.length} · ✓ ${Q.right}`;
}
const canSpeak = 'speechSynthesis' in window;
const speakBtn = c => canSpeak ? `<button class="pill" data-say="${c}">🔊 Hear it</button>` : '';
document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]'); if (!s) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(s.dataset.say); u.lang = 'zh-CN'; u.rate = .8; speechSynthesis.speak(u); } catch (err) {}
});
function killWriter(){ if (writer){ try { writer.cancelQuiz(); } catch (e) {} writer = null; } }
function ask(){
  clearTimeout(autoT); answered = false; hud(); killWriter();
  const day = Q.list[Q.i], [c, , mn] = WORDS[day-1];
  $('fb').textContent = ''; $('fb').className = 'feedback';
  $('next').hidden = true; $('opts').innerHTML = ''; $('wtools').hidden = true; $('after').innerHTML = ''; $('wpartsBox').innerHTML = '';
  if (Q.mode === 'read'){
    $('prompt').innerHTML = `<div class="box">${GRID}<div class="glyph">${c}</div></div>`;
    renderOpts(day, d => `<span class="o-py">${WORDS[d-1][1]}</span><span class="o-mn">${esc(WORDS[d-1][2])}</span>`);
  } else if (Q.mode === 'recall'){
    $('prompt').innerHTML = `<p class="label" style="margin:0">Which character means</p><p class="meaning">${esc(mn)}</p>`;
    renderOpts(day, d => `<span class="o-han">${WORDS[d-1][0]}</span><span class="o-py">${WORDS[d-1][1]}</span>`);
  } else askWrite(day);
}
function renderOpts(day, html){
  const ds = shuffle([day, ...distractors(day, Q.range)]);
  $('opts').innerHTML = ds.map((d,i) => `<button class="opt" data-d="${d}"><span class="k">${i+1}</span>${html(d)}</button>`).join('');
}
$('opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) choose(+b.dataset.d); });
function reveal(day, ok, msg){
  const [c, py, mn] = WORDS[day-1];
  $('fb').className = 'feedback ' + (ok ? 'good' : 'bad');
  $('fb').innerHTML = `${msg} · ${c} ${esc(py)}, ${esc(mn)}`;
  $('after').innerHTML = `<div style="display:flex;flex-direction:column;gap:10px;align-items:center">${speakBtn(c)}<p class="meta">Day ${day}</p></div>` + originHTML(day);
  $('next').hidden = false;
}
function choose(d){
  if (answered) return; answered = true;
  const day = Q.list[Q.i], ok = d === day;
  for (const b of $('opts').children){
    b.disabled = true;
    if (+b.dataset.d === day) b.classList.add('right'); else if (+b.dataset.d === d) b.classList.add('wrong');
  }
  record(day, ok);
  reveal(day, ok, ok ? 'Correct' : 'Not quite');
}
function record(day, ok){
  const c = WORDS[day-1][0];
  if (ok){ Q.right++; S.hit[c] = (S.hit[c]||0) + 1; } else { Q.missed.push(day); S.miss[c] = (S.miss[c]||0) + 1; }
  save(); hud();
}
function next(){
  clearTimeout(autoT);
  if (!answered){ if (Q.mode === 'write') giveUp(); return; }
  Q.i++;
  if (Q.i >= Q.list.length) finish(); else ask();
}
$('next').addEventListener('click', next);
$('quit').addEventListener('click', () => { clearTimeout(autoT); killWriter(); if (Q.i || answered) finish(true); else { show('setup'); paintSetup(); } });

/* ---------- writing ---------- */
const chunks = {};
function loadChar(c){
  const day = WORDS.findIndex(w => w[0] === c) + 1, k = Math.floor((day-1)/100);
  if (!chunks[k]) chunks[k] = fetch(`strokes/s${k}.json`).then(r => { if (!r.ok) throw new Error('load'); return r.json(); }).catch(e => { delete chunks[k]; throw e; });
  return chunks[k].then(j => j[c]);
}
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function makeWriter(target, c, size, extra){
  return HanziWriter.create(target, c, Object.assign({
    width: size, height: size, padding: Math.round(size*0.06),
    strokeColor: tok('--ink'), outlineColor: tok('--line'), drawingColor: tok('--jade'), highlightColor: tok('--seal'),
    radicalColor: tok('--seal'), strokeAnimationSpeed: 1.3, delayBetweenStrokes: 140,
    charDataLoader: (ch, onLoad, onErr) => { loadChar(ch).then(onLoad).catch(onErr); },
    onLoadCharDataError: () => { $('fb').className = 'feedback bad'; $('fb').textContent = 'Stroke data did not load. Open the app once while online.'; }
  }, extra));
}
function askWrite(day){
  const [, py, mn] = WORDS[day-1];
  $('prompt').innerHTML = `<p class="py">${esc(py)}</p><p class="meaning">${esc(mn)}</p><div class="box big" id="wbox">${GRID}<div class="writer" id="wtarget"></div></div>`;
  $('wtools').hidden = false;
  for (const id of ['wParts','wHint']) $(id).setAttribute('aria-pressed', 'false');
  $('fb').textContent = 'Draw the character in the box.';
  wState = {day, outline: false};
  const size = $('wbox').clientWidth - 4;
  writer = makeWriter('wtarget', WORDS[day-1][0], size, {showCharacter: false, showOutline: false, showHintAfterMisses: 3, drawingWidth: Math.max(14, size/18)});
  quiz();
}
function quiz(){
  writer.quiz({
    onComplete: s => {
      if (answered) return;
      const ok = !wState.outline && s.totalMistakes <= 2;
      answered = true; record(wState.day, ok);
      reveal(wState.day, ok, ok ? `Nice, ${s.totalMistakes} slip${s.totalMistakes===1?'':'s'}` : (wState.outline ? 'Done with the outline on' : `${s.totalMistakes} slips, try this one again later`));
      $('wpartsBox').innerHTML = '';
    }
  });
}
$('wParts').addEventListener('click', () => {
  if (!wState || answered) return;
  const on = $('wParts').getAttribute('aria-pressed') !== 'true';
  $('wParts').setAttribute('aria-pressed', on);
  $('wpartsBox').innerHTML = on ? originHTML(wState.day, {partsOnly: true}) : '';
});
$('wHint').addEventListener('click', () => {
  if (!writer || answered) return;
  wState.outline = true; writer.showOutline(); $('wHint').setAttribute('aria-pressed', 'true');
});
$('wRedo').addEventListener('click', () => { if (!writer || answered) return; writer.cancelQuiz(); quiz(); });
$('wShow').addEventListener('click', giveUp);
function giveUp(){
  if (!writer) return;
  writer.cancelQuiz();
  if (!answered){ answered = true; record(wState.day, false); reveal(wState.day, false, 'Watch the stroke order'); $('wpartsBox').innerHTML = ''; }
  writer.hideOutline(); writer.animateCharacter();
}

/* ---------- study ---------- */
let St = null, sWriter = null;
function startStudy(days){ St = {days, i: 0}; show('study'); paintStudy(); }
function paintStudy(){
  sWriter = null;
  const day = St.days[St.i], [c, py, mn] = WORDS[day-1];
  $('sBar').style.width = ((St.i + 1) / St.days.length * 100) + '%';
  $('sTally').textContent = `${St.i + 1} / ${St.days.length} · Day ${day}`;
  $('sCard').innerHTML = `<div class="box" id="sbox">${GRID}<div class="glyph" id="sglyph">${c}</div><div class="writer" id="starget"></div></div>
    <p class="py">${esc(py)}</p><p class="meaning">${esc(mn)}</p>
    <div class="row" style="justify-content:center"><button class="pill" id="sAnim">✍️ Stroke order</button>${speakBtn(c)}</div>
    ${originHTML(day)}`;
  $('sPrev').disabled = St.i === 0; $('sPrev').style.visibility = St.i === 0 ? 'hidden' : 'visible';
  $('sNext').textContent = St.i === St.days.length - 1 ? 'Done' : 'Next';
}
$('sCard').addEventListener('click', e => {
  if (!e.target.closest('#sAnim') || typeof HanziWriter === 'undefined') return;
  const c = WORDS[St.days[St.i]-1][0];
  if (!sWriter){
    $('sglyph').hidden = true;
    sWriter = makeWriter('starget', c, $('sbox').clientWidth - 4, {showCharacter: false, showOutline: true});
  }
  sWriter.animateCharacter();
});
function studyStep(dir){
  const n = St.i + dir;
  if (n < 0) return;
  if (n >= St.days.length){ show('setup'); paintSetup(); return; }
  St.i = n; paintStudy(); window.scrollTo(0, 0);
}
$('sPrev').addEventListener('click', () => studyStep(-1));
$('sNext').addEventListener('click', () => studyStep(1));
$('sQuit').addEventListener('click', () => { show('setup'); paintSetup(); });
let tx = null, ty = null;
$('sCard').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
$('sCard').addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) studyStep(dx < 0 ? 1 : -1);
});

/* ---------- results ---------- */
function finish(early){
  killWriter();
  const done = early ? Q.i + (answered ? 1 : 0) : Q.list.length;
  $('score').innerHTML = `${Q.right}<small> / ${done}</small>`;
  const pct = done ? Q.right / done : 0;
  $('scoreNote').textContent = !done ? 'No questions answered.' : pct === 1 ? 'Every one right.' : pct >= .8 ? 'Solid. Review the few below.' : 'Study the ones below, then quiz them again.';
  const uniq = [...new Set(Q.missed)];
  for (const id of ['missPanel','again','studyMissed']) $(id).hidden = !uniq.length;
  $('missList').innerHTML = uniq.map(d => { const [c,py,mn] = WORDS[d-1];
    return `<button data-day="${d}"><span class="h">${c}</span><span class="d">Day ${d}</span><span class="t"><b>${esc(py)}</b>${esc(mn)}</span></button>`; }).join('');
  Q.retry = uniq;
  show('results');
}
$('missList').addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if (!b) return;
  const i = Q.retry.indexOf(+b.dataset.day); St = {days: Q.retry.slice(), i: Math.max(0, i)}; show('study'); paintStudy();
});
$('studyMissed').addEventListener('click', () => startStudy(Q.retry.slice()));
$('again').addEventListener('click', () => startQuiz(shuffle(Q.retry.slice())));
$('home').addEventListener('click', () => { show('setup'); paintSetup(); });

/* ---------- keyboard (laptop) ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const v = app.dataset.view;
  if (v === 'quiz'){
    if (/^[1-4]$/.test(e.key)){ const b = $('opts').children[+e.key-1]; if (b) choose(+b.dataset.d); }
    else if ((e.key === 'Enter' || e.key === ' ') && !$('next').hidden){ e.preventDefault(); next(); }
  } else if (v === 'study'){
    if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); studyStep(1); }
    else if (e.key === 'ArrowLeft') studyStep(-1);
  }
});

/* ---------- offline support (works when hosted, e.g. GitHub Pages) ---------- */
function markOffline(){ $('offline').hidden = false; }
try {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (navigator.serviceWorker.controller) markOffline();
      navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'cached') markOffline(); });
    }).catch(() => {});
  }
} catch (e) {}

paintSetup();
</script>
